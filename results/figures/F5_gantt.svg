<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520"><rect width="100%" height="100%" fill="white"/><text x="450" y="35" text-anchor="middle" font-size="24" font-family="Arial">F5 — Gantt chart at N = 15</text><text x="130" y="125" text-anchor="end" font-size="16" font-family="Arial">T1 CVB</text><text x="130" y="230" text-anchor="end" font-size="16" font-family="Arial">T2 Energy</text><text x="130" y="335" text-anchor="end" font-size="16" font-family="Arial">T3 Grid</text><line x1="150" y1="120" x2="820" y2="120" stroke="#222"/><line x1="150" y1="225" x2="820" y2="225" stroke="#222"/><line x1="150" y1="330" x2="820" y2="330" stroke="#222"/><rect x="150" y="95" width="75" height="45" fill="#ef9999" stroke="#aa3333"/><rect x="225" y="95" width="245" height="45" fill="#99d8aa" stroke="#338855"/><rect x="370" y="95" width="75" height="45" fill="#ef9999" stroke="#aa3333" opacity="0.7"/><rect x="445" y="95" width="245" height="45" fill="#99d8aa" stroke="#338855" opacity="0.7"/><rect x="590" y="95" width="75" height="45" fill="#ef9999" stroke="#aa3333" opacity="0.7"/><rect x="665" y="95" width="145" height="45" fill="#99d8aa" stroke="#338855" opacity="0.7"/><rect x="225" y="200" width="18" height="45" fill="#f6e79b" stroke="#aa8800"/><rect x="245" y="305" width="30" height="45" fill="#c6b6dd" stroke="#775599"/><text x="187" y="88" text-anchor="middle" font-size="14" font-family="Arial">CVB ≈17 µs</text><text x="347" y="88" text-anchor="middle" font-size="14" font-family="Arial">SPI acquisition ≈108 µs</text><text x="450" y="410" text-anchor="middle" font-size="15" font-family="Arial">At N=15 the measurement path dominates the fast 100 µs control window.</text><text x="450" y="455" text-anchor="middle" font-size="14" font-family="Arial">Dual-bus DMA reduces the acquisition block to about 54 µs and recovers slack.</text></svg>