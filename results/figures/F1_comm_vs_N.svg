<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520"><rect width="100%" height="100%" fill="white"/><text x="450" y="35" text-anchor="middle" font-size="24" font-family="Arial">F1 — Centralized acquisition time vs N</text><rect x="85" y="70" width="700" height="360" fill="none" stroke="#222"/><text x="435" y="475" text-anchor="middle" font-size="16" font-family="Arial">Number of submodules per arm, N</text><text x="28" y="250" transform="rotate(-90 28 250)" text-anchor="middle" font-size="16" font-family="Arial">Acquisition time [µs]</text><line x1="115" y1="140" x2="750" y2="80" stroke="#1f77b4" stroke-width="4"/><line x1="115" y1="210" x2="750" y2="120" stroke="#ff7f0e" stroke-width="4"/><line x1="115" y1="300" x2="750" y2="250" stroke="#d62728" stroke-width="4"/><line x1="115" y1="380" x2="750" y2="365" stroke="#2ca02c" stroke-width="4"/><rect x="85" y="190" width="700" height="110" fill="#cccccc" opacity="0.35"/><text x="795" y="85" font-size="14" font-family="Arial" fill="#1f77b4">CAN / FDCAN: too slow</text><text x="795" y="125" font-size="14" font-family="Arial" fill="#ff7f0e">UART / Ethernet</text><text x="795" y="255" font-size="14" font-family="Arial" fill="#d62728">SPI20M: N=15 ≈108 µs shared</text><text x="795" y="370" font-size="14" font-family="Arial" fill="#2ca02c">Aurora: very low latency</text><text x="430" y="220" text-anchor="middle" font-size="14" font-family="Arial">100–500 µs task-control zone</text><text x="450" y="500" text-anchor="middle" font-size="14" font-family="Arial">Centralized communication grows as 2N frames per fast period.</text></svg>