<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520"><rect width="100%" height="100%" fill="white"/><text x="450" y="35" text-anchor="middle" font-size="24" font-family="Arial">F2 — Computing scaling laws</text><rect x="85" y="70" width="700" height="360" fill="none" stroke="#222"/><text x="435" y="475" text-anchor="middle" font-size="16" font-family="Arial">N per arm</text><text x="28" y="250" transform="rotate(-90 28 250)" text-anchor="middle" font-size="16" font-family="Arial">Computing time per period [µs]</text><polyline points="115,380 250,330 385,245 520,145 750,85" fill="none" stroke="#d62728" stroke-width="4"/><polyline points="115,360 250,325 385,285 520,235 750,170" fill="none" stroke="#ff7f0e" stroke-width="4" stroke-dasharray="8 5"/><polyline points="115,345 250,335 385,320 520,300 750,265" fill="none" stroke="#2ca02c" stroke-width="4" stroke-dasharray="5 5"/><line x1="115" y1="305" x2="750" y2="305" stroke="#9467bd" stroke-width="4"/><line x1="115" y1="240" x2="750" y2="240" stroke="#111" stroke-width="2"/><text x="760" y="90" font-size="14" font-family="Arial" fill="#d62728">Bubble O(N²)</text><text x="760" y="174" font-size="14" font-family="Arial" fill="#ff7f0e">Merge O(N log N)</text><text x="760" y="268" font-size="14" font-family="Arial" fill="#2ca02c">±1 rule O(N)</text><text x="760" y="309" font-size="14" font-family="Arial" fill="#9467bd">Local Consensus O(1)</text><text x="760" y="244" font-size="14" font-family="Arial">T1 = 100 µs</text><text x="450" y="500" text-anchor="middle" font-size="14" font-family="Arial">Sorting reduction helps compute, but centralized acquisition can still dominate.</text></svg>