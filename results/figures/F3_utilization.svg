<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520"><rect width="100%" height="100%" fill="white"/><text x="450" y="35" text-anchor="middle" font-size="24" font-family="Arial">F3 — Schedulability utilization U(N)</text><rect x="85" y="70" width="700" height="360" fill="none" stroke="#222"/><text x="435" y="475" text-anchor="middle" font-size="16" font-family="Arial">N per arm</text><text x="28" y="250" transform="rotate(-90 28 250)" text-anchor="middle" font-size="16" font-family="Arial">Processor utilization U(N)</text><line x1="85" y1="200" x2="785" y2="200" stroke="#111" stroke-width="2"/><text x="795" y="205" font-size="14" font-family="Arial">RMS bound U=1</text><polyline points="115,360 230,310 345,235 430,190 520,120 600,60" fill="none" stroke="#d62728" stroke-width="4"/><polyline points="115,355 230,315 345,250 445,195 540,135 640,80" fill="none" stroke="#ff7f0e" stroke-width="4" stroke-dasharray="8 5"/><polyline points="115,350 250,325 390,280 540,225 690,170" fill="none" stroke="#2ca02c" stroke-width="4" stroke-dasharray="5 5"/><line x1="115" y1="340" x2="750" y2="340" stroke="#9467bd" stroke-width="4"/><text x="760" y="95" font-size="14" font-family="Arial" fill="#d62728">centralized grows with N</text><text x="760" y="344" font-size="14" font-family="Arial" fill="#9467bd">Local Consensus nearly flat</text><text x="450" y="500" text-anchor="middle" font-size="14" font-family="Arial">Local workload is constant; the remaining limit is consensus dynamics, not CPU load.</text></svg>